name: pr-verify

on: 
  push:
    branches:
      - master
  pull_request: 
    branches: 
      - master
  
jobs:
  pr-verify-job:
    name: Node ${{ matrix.node }} / OTP ${{ matrix.otp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Run every leg to completion instead of cancelling the rest on the
      # first failure - with an OTP matrix we want to see whether a
      # failure is version-specific, not just that "something" broke. The
      # overall workflow is still reported as failed if any leg fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node:
          - 20
        # apps/erlangbridge branches on OTP_RELEASE (e.g. lsp_handlers.erl
        # picks vscode_erlfmt on OTP >= 21, erl_tidy otherwise), so pin
        # exact releases via erlef/setup-beam rather than "whatever apt/
        # brew currently ships" - the previous ad-hoc install had no
        # version guarantee at all.
        otp:
          - '25.3'
          - '26.2'
          - '27.3'
          - '28.1'
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Erlang/OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g typescript "vsce"
      - run: npm install
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - name: Erlang Common Test suites
        run: ./rebar3 ct

